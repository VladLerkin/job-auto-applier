<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>job-auto-applier</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header-container">
    <div class="tabs">
      <button class="tab-btn active" data-target="generator-tab">Generator</button>
      <button class="tab-btn" data-target="settings-tab">Settings</button>
    </div>
    <button id="close-popup-btn" class="close-btn" title="Close window">&times;</button>
  </div>

  <div id="generator-tab" class="tab-content active">
    <button id="generate-btn" class="primary-btn">🚀 Fill Application Form</button>
    <button id="stop-btn" class="danger-btn hidden">🛑 Stop Agent</button>
    <div id="loading" class="hidden">
      <div class="spinner"></div>
      <span>Agent is filling the form... This may take 1-2 minutes.</span>
    </div>
    <div id="result-container" class="hidden">
      <div id="result-text" class="success-msg">✅ Form filled successfully! Check the browser tab.</div>
    </div>
    <div style="margin-top: 15px; text-align: center;">
      <a href="http://localhost:3000/cover-letter" target="_blank" style="color: #2563eb; font-size: 13px; text-decoration: none; font-weight: 500;">📄 View Last Cover Letter</a>
    </div>
    <div id="error-msg" class="error hidden"></div>
  </div>

  <div id="settings-tab" class="tab-content">
    <div style="margin-bottom: 15px;">
      <button id="save-settings-btn" class="primary-btn">Save Settings</button>
      <div id="save-status" class="status-msg hidden">Saved successfully!</div>
    </div>

    <label for="ai-provider">AI Provider:</label>
    <select id="ai-provider" style="width:100%; margin-bottom:12px; padding:8px; border:1px solid #d1d5db; border-radius:6px;">
      <option value="gemini">Google Gemini (Cloud)</option>
      <option value="local">Local Model (Free / node-llama-cpp)</option>
    </select>

    <div id="gemini-settings">
      <label for="api-key">Gemini API Key:</label>
      <input type="password" id="api-key" placeholder="Enter your API key">
      
      <label for="model-name">Gemini Model Name:</label>
      <input type="text" id="model-name" placeholder="e.g., gemini-3.8-flash" value="gemini-3.8-flash">
    </div>

    <div id="local-settings" class="hidden" style="padding:10px; background:#f9fafb; border:1px solid #e5e7eb; border-radius:6px; margin-bottom:12px;">
      <label for="local-model-url" style="font-size:13px;">GGUF Model Download URL (HuggingFace):</label>
      <input type="text" id="local-model-url" placeholder="https://huggingface.co/.../resolve/main/model.gguf" value="https://huggingface.co/unsloth/gemma-4-E4B-it-qat-GGUF/resolve/main/gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf">
      
      <label for="local-model-filename" style="font-size:13px; margin-top:8px;">Save As (Filename):</label>
      <input type="text" id="local-model-filename" placeholder="gemma-4-E4B.gguf" value="gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf">
      
      <div style="display: flex; gap: 8px; margin-top: 10px;">
        <button id="download-model-btn" class="primary-btn" style="flex: 1; padding: 6px;">📥 Download</button>
        <button id="test-model-btn" class="secondary-btn" style="flex: 1; padding: 6px;">⚙️ Test Model</button>
      </div>
      
      <div id="download-progress-container" class="hidden" style="margin-top:10px;">
        <div style="font-size:12px; margin-bottom:4px; display:flex; justify-content:space-between;">
          <span id="download-status-text">Downloading...</span>
          <span id="download-percentage">0%</span>
        </div>
        <div style="width:100%; background:#e5e7eb; border-radius:4px; height:8px;">
          <div id="download-progress-bar" style="width:0%; background:#059669; height:100%; border-radius:4px; transition: width 0.3s;"></div>
        </div>
      </div>
      <div id="test-model-status" style="font-size:13px; margin-top:8px; font-weight:500;"></div>
    </div>

    
    <label for="profile-text">Your Profile / Preferences:</label>
    <textarea id="profile-text" rows="3" placeholder="E.g., I'm a Senior Frontend Engineer looking for remote work..."></textarea>
    
    <label for="cv-text">Your CV / Resume Text:</label>
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
      <input type="file" id="cv-upload" accept="application/pdf">
      <span id="loaded-pdf-name" style="font-size: 13px; color: #059669; font-weight: 500;"></span>
    </div>
    <textarea id="cv-text" rows="12" placeholder="Paste your CV text here or upload a PDF above..."></textarea>
    <button id="restructure-btn" class="secondary-btn" style="width:100%; margin-bottom:12px;">🤖 Re-structure CV with AI</button>

    <div class="backup-row">
      <button id="export-btn" class="secondary-btn">⬇️ Export Settings</button>
      <label for="import-file" class="secondary-btn import-label">⬆️ Import Settings</label>
      <input type="file" id="import-file" accept=".json,application/json" style="display:none;">
    </div>
    <div id="import-status" class="status-msg hidden">Imported successfully!</div>
  </div>

  <!-- Import Selection Modal -->
  <div id="import-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Select what to import:</h3>
      <div class="checkbox-group">
        <label><input type="checkbox" id="import-cb-profile" checked> Profile / Preferences</label>
        <label><input type="checkbox" id="import-cb-cv" checked> CV / Resume Text</label>
        <label><input type="checkbox" id="import-cb-pdf" checked> CV PDF File</label>
        <label><input type="checkbox" id="import-cb-model" checked> Model Name</label>
      </div>
      <div class="modal-actions">
        <button id="cancel-import-btn" class="secondary-btn">Cancel</button>
        <button id="confirm-import-btn" class="primary-btn">Import Selected</button>
      </div>
    </div>
  </div>

  <script src="../lib/pdf.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
